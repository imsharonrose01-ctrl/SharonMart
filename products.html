<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SharonMart - Products</title>

<link rel="stylesheet" href="style.css">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fdf9fb;
    color: #333;
}

.header {
    background: #ffffff;
    padding: 22px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #f1e5ea;
    box-shadow: 0 3px 15px rgba(80, 40, 60, 0.06);
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #9b5c76;
    margin: 0;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.cart-button {
    border: none;
    background: #f3dce6;
    color: #75445a;
    padding: 11px 18px;
    border-radius: 25px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
}

.cart-button:hover {
    background: #eacbd8;
}

.hero {
    text-align: center;
    padding: 35px 20px 20px;
}

.hero h2 {
    margin: 0;
    font-size: 28px;
    color: #4a3941;
}

.hero p {
    margin-top: 8px;
    color: #8b7a82;
}

.controls {
    max-width: 1100px;
    margin: 20px auto 30px;
    padding: 0 20px;
    display: flex;
    gap: 12px;
}

.search-box {
    flex: 1;
    position: relative;
}

.search-box input {
    width: 100%;
    padding: 14px 18px;
    border: 1px solid #eadde3;
    border-radius: 12px;
    background: white;
    outline: none;
    font-size: 14px;
}

.search-box input:focus {
    border-color: #c78da7;
}

.category-box {
    width: 210px;
}

.category-box select {
    width: 100%;
    padding: 14px;
    border: 1px solid #eadde3;
    border-radius: 12px;
    background: white;
    outline: none;
    font-size: 14px;
    color: #555;
}

.products-container {
    max-width: 1100px;
    margin: auto;
    padding: 0 20px 50px;
}

.products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.product {
    background: white;
    border: 1px solid #f0e5ea;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 6px 20px rgba(100, 60, 80, 0.06);
    transition: transform 0.2s, box-shadow 0.2s;
}

.product:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(100, 60, 80, 0.10);
}

.product-top {
    margin-bottom: 15px;
}

.product-icon {
    width: 65px;
    height: 65px;
    border-radius: 16px;
    background: #f8e9ef;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin-bottom: 15px;
}

.product h3 {
    margin: 0 0 8px;
    font-size: 20px;
    color: #40343a;
}

.price {
    font-size: 18px;
    font-weight: bold;
    color: #a05275;
    margin: 0;
}

.add-button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 10px;
    background: #9b5c76;
    color: white;
    cursor: pointer;
    font-size: 14px;
    margin-top: 15px;
    transition: 0.2s;
}

.add-button:hover {
    background: #824a62;
}

.review-section {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid #f0e5ea;
}

.review-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.review-title h4 {
    margin: 0;
    color: #514149;
    font-size: 15px;
}

.review-form {
    background: #fdf8fa;
    border: 1px solid #f1e3e9;
    border-radius: 12px;
    padding: 13px;
}

.review-form input,
.review-form textarea,
.review-form select {
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    border: 1px solid #e8dce2;
    border-radius: 8px;
    background: white;
    font-size: 13px;
    outline: none;
    font-family: Arial, sans-serif;
}

.review-form input:focus,
.review-form textarea:focus,
.review-form select:focus {
    border-color: #c78da7;
}

.review-form textarea {
    height: 65px;
    resize: none;
}

.review-button {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 8px;
    background: #ead0dc;
    color: #70445a;
    font-size: 13px;
    cursor: pointer;
}

.review-button:hover {
    background: #dfbdcd;
}

.review {
    background: #faf6f8;
    border: 1px solid #f0e4e9;
    border-radius: 10px;
    padding: 11px;
    margin-bottom: 8px;
}

.review-name {
    font-size: 13px;
    font-weight: bold;
    color: #514149;
}

.stars {
    color: #e5a72d;
    font-size: 15px;
    margin: 3px 0;
}

.review-text {
    font-size: 13px;
    color: #666;
    margin: 5px 0;
    line-height: 1.4;
}

.review-date {
    font-size: 11px;
    color: #999;
}

.no-reviews {
    color: #999;
    font-size: 12px;
    margin: 5px 0 10px;
}

.cart-section {
    display: none;
    max-width: 850px;
    margin: 20px auto 50px;
    padding: 25px;
    background: white;
    border: 1px solid #f0e5ea;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(100, 60, 80, 0.08);
}

.cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #f0e5ea;
    padding-bottom: 15px;
}

.cart-header h2 {
    margin: 0;
    color: #493b42;
}

.close-button {
    border: none;
    background: #f5eef1;
    color: #755b67;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
}

.cart-item {
    padding: 17px 0;
    border-bottom: 1px solid #f3eaee;
}

.cart-item:last-child {
    border-bottom: none;
}

.cart-item-name {
    font-weight: bold;
    color: #493b42;
    font-size: 15px;
}

.cart-item-price {
    color: #a05275;
    font-weight: bold;
    margin: 6px 0;
}

.quantity-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
}

.quantity-controls button,
.remove-button {
    border: none;
    cursor: pointer;
    border-radius: 7px;
}

.quantity-controls button {
    width: 30px;
    height: 28px;
    background: #f3e2e9;
    color: #70445a;
}

.quantity {
    min-width: 25px;
    text-align: center;
}

.remove-button {
    margin-top: 8px;
    padding: 7px 11px;
    background: #f7e8eb;
    color: #a05262;
}

.cart-bottom {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #eee2e7;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.cart-total {
    font-size: 20px;
    font-weight: bold;
    color: #493b42;
}

.checkout-button {
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    background: #9b5c76;
    color: white;
    cursor: pointer;
}

.checkout-button:hover {
    background: #824a62;
}

.order-message {
    display: none;
    max-width: 700px;
    margin: 20px auto;
    padding: 22px;
    background: #f0f8f3;
    border: 1px solid #d9ebdf;
    color: #477158;
    border-radius: 14px;
    text-align: center;
}

.order-message h2 {
    margin: 0 0 6px;
}

@media (max-width: 850px) {

    .products {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 600px) {

    .header {
        padding: 18px 20px;
    }

    .logo {
        font-size: 22px;
    }

    .hero h2 {
        font-size: 23px;
    }

    .controls {
        flex-direction: column;
    }

    .category-box {
        width: 100%;
    }

    .products {
        grid-template-columns: 1fr;
    }

    .cart-bottom {
        flex-direction: column;
        gap: 15px;
        align-items: stretch;
    }

    .checkout-button {
        width: 100%;
    }

}

</style>
</head>

<body>

<header class="header">

    <h1 class="logo">SharonMart</h1>

    <div class="header-right">

        <button class="cart-button" onclick="showCart()">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>

    </div>

</header>


<section class="hero">

    <h2>Explore Our Products</h2>

    <p>Find what you need and shop with ease.</p>

</section>


<div class="controls">

    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="Search products..."
        >

    </div>

    <div class="category-box">

        <select id="categoryFilter">

            <option value="all">
                All Categories
            </option>

            <option value="mobile">
                Mobile
            </option>

            <option value="laptop">
                Laptop
            </option>

            <option value="audio">
                Audio
            </option>

        </select>

    </div>

</div>


<div class="products-container">

<div class="products" id="products">


<div class="product" data-category="mobile">

    <div class="product-top">

        <div class="product-icon">
            📱
        </div>

        <h3>Smartphone</h3>

        <p class="price">
            ₹50,000
        </p>

    </div>

    <button
        class="add-button"
        onclick="addToCart('Smartphone', 50000)"
    >
        Add to Cart
    </button>


    <div class="review-section">

        <div class="review-title">
            <h4>⭐ Customer Reviews</h4>
        </div>

        <div id="reviews-Smartphone"></div>

        <div class="review-form">

            <input
                type="text"
                id="name-Smartphone"
                placeholder="Your name"
            >

            <select id="rating-Smartphone">

                <option value="5">★★★★★ 5 Stars</option>
                <option value="4">★★★★☆ 4 Stars</option>
                <option value="3">★★★☆☆ 3 Stars</option>
                <option value="2">★★☆☆☆ 2 Stars</option>
                <option value="1">★☆☆☆☆ 1 Star</option>

            </select>

            <textarea
                id="text-Smartphone"
                placeholder="Write your review..."
            ></textarea>

            <button
                class="review-button"
                onclick="addReview('Smartphone')"
            >
                Submit Review
            </button>

        </div>

    </div>

</div>



<div class="product" data-category="laptop">

    <div class="product-top">

        <div class="product-icon">
            💻
        </div>

        <h3>Laptop</h3>

        <p class="price">
            ₹45,000
        </p>

    </div>

    <button
        class="add-button"
        onclick="addToCart('Laptop', 45000)"
    >
        Add to Cart
    </button>


    <div class="review-section">

        <div class="review-title">
            <h4>⭐ Customer Reviews</h4>
        </div>

        <div id="reviews-Laptop"></div>

        <div class="review-form">

            <input
                type="text"
                id="name-Laptop"
                placeholder="Your name"
            >

            <select id="rating-Laptop">

                <option value="5">★★★★★ 5 Stars</option>
                <option value="4">★★★★☆ 4 Stars</option>
                <option value="3">★★★☆☆ 3 Stars</option>
                <option value="2">★★☆☆☆ 2 Stars</option>
                <option value="1">★☆☆☆☆ 1 Star</option>

            </select>

            <textarea
                id="text-Laptop"
                placeholder="Write your review..."
            ></textarea>

            <button
                class="review-button"
                onclick="addReview('Laptop')"
            >
                Submit Review
            </button>

        </div>

    </div>

</div>



<div class="product" data-category="audio">

    <div class="product-top">

        <div class="product-icon">
            🎧
        </div>

        <h3>Wireless Headphones</h3>

        <p class="price">
            ₹2,000
        </p>

    </div>

    <button
        class="add-button"
        onclick="addToCart('Wireless Headphones', 2000)"
    >
        Add to Cart
    </button>


    <div class="review-section">

        <div class="review-title">
            <h4>⭐ Customer Reviews</h4>
        </div>

        <div id="reviews-Wireless-Headphones"></div>

        <div class="review-form">

            <input
                type="text"
                id="name-Wireless-Headphones"
                placeholder="Your name"
            >

            <select id="rating-Wireless-Headphones">

                <option value="5">★★★★★ 5 Stars</option>
                <option value="4">★★★★☆ 4 Stars</option>
                <option value="3">★★★☆☆ 3 Stars</option>
                <option value="2">★★☆☆☆ 2 Stars</option>
                <option value="1">★☆☆☆☆ 1 Star</option>

            </select>

            <textarea
                id="text-Wireless-Headphones"
                placeholder="Write your review..."
            ></textarea>

            <button
                class="review-button"
                onclick="addReview('Wireless Headphones')"
            >
                Submit Review
            </button>

        </div>

    </div>

</div>


</div>

</div>


<div class="cart-section" id="cartSection">

    <div class="cart-header">

        <h2>Your Cart</h2>

        <button
            class="close-button"
            onclick="hideCart()"
        >
            Close
        </button>

    </div>

    <div id="cartItems"></div>

    <div class="cart-bottom">

        <div
            class="cart-total"
            id="cartTotal"
        >
            Total: ₹0
        </div>

        <button
            class="checkout-button"
            onclick="checkout()"
        >
            Checkout
        </button>

    </div>

</div>


<div class="order-message" id="orderMessage">

    <h2>Order Successful! 🎉</h2>

    <p>
        Your order has been placed successfully.
    </p>

</div>


<script>

let cart =
    JSON.parse(localStorage.getItem("cart")) || [];


function addToCart(name, price) {

    let existingProduct =
        cart.find(function(product) {
            return product.name === name;
        });

    if (existingProduct) {

        existingProduct.quantity++;

    } else {

        cart.push({

            name: name,

            price: price,

            quantity: 1

        });

    }

    saveCart();

    updateCartCount();

    alert(name + " added to cart");

}


function saveCart() {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}


function updateCartCount() {

    let count = 0;

    cart.forEach(function(product) {

        count += product.quantity;

    });

    document.getElementById(
        "cartCount"
    ).textContent = count;

}


function showCart() {

    document.getElementById(
        "cartSection"
    ).style.display = "block";

    displayCart();

    document.getElementById(
        "cartSection"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


function hideCart() {

    document.getElementById(
        "cartSection"
    ).style.display = "none";

}


function displayCart() {

    let cartItems =
        document.getElementById("cartItems");

    if (cart.length === 0) {

        cartItems.innerHTML =
            "<p>Your cart is empty.</p>";

        document.getElementById(
            "cartTotal"
        ).textContent = "Total: ₹0";

        return;

    }

    let html = "";

    let total = 0;

    cart.forEach(function(product, index) {

        let itemTotal =
            product.price * product.quantity;

        total += itemTotal;

        html += `

            <div class="cart-item">

                <div class="cart-item-name">
                    ${product.name}
                </div>

                <div class="cart-item-price">
                    ₹${product.price}
                </div>

                <div class="quantity-controls">

                    <span>Quantity:</span>

                    <button
                        onclick="decreaseQuantity(${index})"
                    >
                        −
                    </button>

                    <span class="quantity">
                        ${product.quantity}
                    </span>

                    <button
                        onclick="increaseQuantity(${index})"
                    >
                        +
                    </button>

                </div>

                <p>
                    Item Total:
                    <strong>₹${itemTotal}</strong>
                </p>

                <button
                    class="remove-button"
                    onclick="removeFromCart(${index})"
                >
                    Remove
                </button>

            </div>

        `;

    });

    cartItems.innerHTML = html;

    document.getElementById(
        "cartTotal"
    ).textContent = "Total: ₹" + total;

}


function increaseQuantity(index) {

    cart[index].quantity++;

    saveCart();

    updateCartCount();

    displayCart();

}


function decreaseQuantity(index) {

    if (cart[index].quantity > 1) {

        cart[index].quantity--;

    } else {

        cart.splice(index, 1);

    }

    saveCart();

    updateCartCount();

    displayCart();

}


function removeFromCart(index) {

    cart.splice(index, 1);

    saveCart();

    updateCartCount();

    displayCart();

}


function checkout() {

    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;

    }

    let orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];

    let order = {

        orderId: orders.length + 1,

        products: cart,

        date: new Date().toLocaleString(),

        status: "Pending"

    };

    orders.push(order);

    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );

    cart = [];

    saveCart();

    updateCartCount();

    displayCart();

    document.getElementById(
        "orderMessage"
    ).style.display = "block";

    setTimeout(function() {

        document.getElementById(
            "orderMessage"
        ).style.display = "none";

    }, 4000);

}


function filterProducts() {

    let searchText =
        document.getElementById(
            "search"
        ).value.toLowerCase();

    let category =
        document.getElementById(
            "categoryFilter"
        ).value;

    let products =
        document.querySelectorAll(
            ".product"
        );

    products.forEach(function(product) {

        let name =
            product.querySelector(
                "h3"
            ).textContent.toLowerCase();

        let productCategory =
            product.getAttribute(
                "data-category"
            );

        let matchesSearch =
            name.includes(searchText);

        let matchesCategory =
            category === "all" ||
            productCategory === category;

        if (
            matchesSearch &&
            matchesCategory
        ) {

            product.style.display =
                "block";

        } else {

            product.style.display =
                "none";

        }

    });

}


document.getElementById(
    "search"
).addEventListener(
    "input",
    filterProducts
);


document.getElementById(
    "categoryFilter"
).addEventListener(
    "change",
    filterProducts
);


function getReviewKey(productName) {

    return "reviews_" + productName;

}


function addReview(productName) {

    let id =
        productName.replaceAll(
            " ",
            "-"
        );

    let name =
        document.getElementById(
            "name-" + id
        ).value.trim();

    let rating =
        document.getElementById(
            "rating-" + id
        ).value;

    let text =
        document.getElementById(
            "text-" + id
        ).value.trim();

    if (
        name === "" ||
        text === ""
    ) {

        alert(
            "Please enter your name and review."
        );

        return;

    }

    let key =
        getReviewKey(productName);

    let reviews =
        JSON.parse(
            localStorage.getItem(key)
        ) || [];

    reviews.push({

        name: name,

        rating: Number(rating),

        text: text,

        date:
            new Date().toLocaleDateString()

    });

    localStorage.setItem(
        key,
        JSON.stringify(reviews)
    );

    document.getElementById(
        "name-" + id
    ).value = "";

    document.getElementById(
        "text-" + id
    ).value = "";

    displayReviews(productName);

}


function displayReviews(productName) {

    let key =
        getReviewKey(productName);

    let reviews =
        JSON.parse(
            localStorage.getItem(key)
        ) || [];

    let containerId =
        "reviews-" +
        productName.replaceAll(
            " ",
            "-"
        );

    let container =
        document.getElementById(
            containerId
        );

    if (reviews.length === 0) {

        container.innerHTML =
            "<p class='no-reviews'>No reviews yet.</p>";

        return;

    }

    let html = "";

    reviews.forEach(function(review) {

        let stars = "";

        for (
            let i = 0;
            i < review.rating;
            i++
        ) {

            stars += "★";

        }

        html += `

            <div class="review">

                <div class="review-name">
                    ${review.name}
                </div>

                <div class="stars">
                    ${stars}
                </div>

                <div class="review-text">
                    ${review.text}
                </div>

                <div class="review-date">
                    ${review.date}
                </div>

            </div>

        `;

    });

    container.innerHTML = html;

}


function loadReviews() {

    displayReviews("Smartphone");

    displayReviews("Laptop");

    displayReviews(
        "Wireless Headphones"
    );

}


updateCartCount();

loadReviews();

</script>

</body>
</html>
