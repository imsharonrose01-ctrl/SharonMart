<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Seller Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .seller-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .seller-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .seller-box h1 {
            color: #333333;
            margin-bottom: 8px;
        }

        .seller-box h2 {
            color: #444444;
        }

        .seller-box h3 {
            color: #555555;
        }

        .seller-box label {
            display: block;
            margin-top: 10px;
            color: #555555;
        }

        .seller-box input {
            width: 100%;
            padding: 11px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #dddddd;
            border-radius: 6px;
            background: #fafafa;
        }

        .seller-box input:focus {
            outline: none;
            border-color: #bbbbbb;
        }

        .seller-box button {
            padding: 10px 18px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #f1f1f1;
            color: #333333;
        }

        .seller-box button:hover {
            background: #e5e5e5;
        }

        .product-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .product-table th,
        .product-table td {
            border: 1px solid #e5e5e5;
            padding: 12px;
            text-align: center;
        }

        .product-table th {
            background: #f7f7f7;
            color: #444444;
        }

        .product-table td {
            background: #ffffff;
        }

        #result {
            font-weight: bold;
            color: #555555;
            margin-top: 15px;
        }

    </style>

</head>

<body>

    <div class="seller-container">

        <div class="seller-box">

            <h1>SharonMart</h1>

            <h2>Seller Dashboard</h2>

            <h3 id="formTitle">Add Product</h3>

            <label>Product Name</label>

            <input
                type="text"
                id="productName"
                placeholder="Enter product name"
            >

            <label>Price</label>

            <input
                type="number"
                id="productPrice"
                placeholder="Enter price"
            >

            <label>Quantity</label>

            <input
                type="number"
                id="productQuantity"
                placeholder="Enter quantity"
            >

            <button
                onclick="saveProduct()"
                id="saveButton"
            >
                ADD PRODUCT
            </button>

            <button
                onclick="cancelEdit()"
                id="cancelButton"
                style="display:none;"
            >
                CANCEL
            </button>

            <p id="result"></p>

        </div>


        <div class="seller-box">

            <h2>My Products</h2>

            <div id="productTable"></div>

        </div>

    </div>


    <script>

        let products =
            JSON.parse(localStorage.getItem("sellerProducts")) || [];

        let editIndex = -1;


        function saveProducts() {

            localStorage.setItem(
                "sellerProducts",
                JSON.stringify(products)
            );

        }


        function saveProduct() {

            let name =
                document.getElementById("productName").value.trim();

            let price =
                document.getElementById("productPrice").value;

            let quantity =
                document.getElementById("productQuantity").value;


            if (name === "" || price === "" || quantity === "") {

                document.getElementById("result").innerText =
                    "Please fill all details.";

                return;

            }


            if (Number(price) <= 0 || Number(quantity) <= 0) {

                document.getElementById("result").innerText =
                    "Price and quantity must be greater than 0.";

                return;

            }


            if (editIndex === -1) {

                products.push({

                    name: name,

                    price: Number(price),

                    quantity: Number(quantity)

                });

                document.getElementById("result").innerText =
                    "Product Added Successfully!";

            } else {

                products[editIndex] = {

                    name: name,

                    price: Number(price),

                    quantity: Number(quantity)

                };

                document.getElementById("result").innerText =
                    "Product Updated Successfully!";

                editIndex = -1;

                document.getElementById("formTitle").innerText =
                    "Add Product";

                document.getElementById("saveButton").innerText =
                    "ADD PRODUCT";

                document.getElementById("cancelButton").style.display =
                    "none";

            }


            saveProducts();

            clearForm();

            displayProducts();

        }


        function displayProducts() {

            let table =
                document.getElementById("productTable");


            if (products.length === 0) {

                table.innerHTML =
                    "<p>No products added yet.</p>";

                return;

            }


            let html = `

                <table class="product-table">

                    <tr>

                        <th>Product Name</th>

                        <th>Price</th>

                        <th>Quantity</th>

                        <th>Actions</th>

                    </tr>

            `;


            products.forEach(function(product, index) {

                html += `

                    <tr>

                        <td>${product.name}</td>

                        <td>₹${product.price}</td>

                        <td>${product.quantity}</td>

                        <td>

                            <button
                                onclick="editProduct(${index})"
                            >
                                Edit
                            </button>

                            <button
                                onclick="deleteProduct(${index})"
                            >
                                Delete
                            </button>

                        </td>

                    </tr>

                `;

            });


            html += "</table>";

            table.innerHTML = html;

        }


        function editProduct(index) {

            let product = products[index];


            document.getElementById("productName").value =
                product.name;

            document.getElementById("productPrice").value =
                product.price;

            document.getElementById("productQuantity").value =
                product.quantity;


            editIndex = index;


            document.getElementById("formTitle").innerText =
                "Edit Product";

            document.getElementById("saveButton").innerText =
                "UPDATE PRODUCT";

            document.getElementById("cancelButton").style.display =
                "inline-block";

            document.getElementById("result").innerText = "";

        }


        function deleteProduct(index) {

            let confirmDelete =
                confirm("Are you sure you want to delete this product?");


            if (!confirmDelete) {

                return;

            }


            products.splice(index, 1);

            saveProducts();

            displayProducts();

            document.getElementById("result").innerText =
                "Product Deleted Successfully!";

        }


        function cancelEdit() {

            editIndex = -1;

            clearForm();


            document.getElementById("formTitle").innerText =
                "Add Product";

            document.getElementById("saveButton").innerText =
                "ADD PRODUCT";

            document.getElementById("cancelButton").style.display =
                "none";

            document.getElementById("result").innerText = "";

        }


        function clearForm() {

            document.getElementById("productName").value = "";

            document.getElementById("productPrice").value = "";

            document.getElementById("productQuantity").value = "";

        }


        displayProducts();

    </script>

</body>

</html>
